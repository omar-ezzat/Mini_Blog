apiVersion: v1
kind: Service
metadata:
  name: activity-service
  namespace: miniblog
spec:
  selector: { app: activity-service }
  ports: [{ port: 3003, targetPort: 3003 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: miniblog
spec:
  replicas: 1
  selector: { matchLabels: { app: activity-service } }
  template:
    metadata: { labels: { app: activity-service } }
    spec:
      containers:
        - name: activity-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/activity-service:latest
          ports: [{ containerPort: 3003 }]
          env:
            - { name: PORT, value: "3003" }
            - name: MONGODB_URI
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: ACTIVITY_MONGODB_URI } }
            - { name: KAFKA_CLIENT_ID, value: activity-service }
            - name: KAFKA_BROKERS
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: KAFKA_BROKERS } }
            - name: KAFKA_GROUP_ID
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: ACTIVITY_KAFKA_GROUP_ID } }
            - name: KAFKA_TOPIC
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: ACTIVITY_KAFKA_TOPIC } }
          readinessProbe: { httpGet: { path: /health, port: 3003 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3003 }, initialDelaySeconds: 30, periodSeconds: 20 }
