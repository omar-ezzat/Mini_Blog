apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: miniblog
spec:
  selector: { app: identity-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: miniblog
spec:
  replicas: 1
  selector: { matchLabels: { app: identity-service } }
  template:
    metadata: { labels: { app: identity-service } }
    spec:
      containers:
        - name: identity-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/identity-service:latest
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - name: MONGODB_URI
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: IDENTITY_MONGODB_URI } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: miniblog-secrets, key: JWT_SECRET } }
            - name: JWT_EXPIRES_IN
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: JWT_EXPIRES_IN } }
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: JWT_REFRESH_EXPIRES_IN } }
            - { name: KAFKA_CLIENT_ID, value: identity-service }
            - name: KAFKA_BROKERS
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: KAFKA_BROKERS } }
            - name: KAFKA_TOPIC
              valueFrom: { configMapKeyRef: { name: miniblog-config, key: IDENTITY_KAFKA_TOPIC } }
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 30, periodSeconds: 20 }
