apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: miniblog
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: miniblog
spec:
  selector: { app: mongodb }
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: miniblog
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe: { exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"] }, initialDelaySeconds: 10, periodSeconds: 10 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mongodb-data } }]
